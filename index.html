<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen Time &amp; Wellbeing Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="form-side">
      <h1>How does screen time sit with your mental health?</h1>
      <p class="lead">Fill in a student's daily habits and get a predicted mental health score.</p>

      <form id="predict-form" novalidate>
        <fieldset>
          <legend>About the student</legend>
          <div class="grid">
            <label>Age
              <input type="number" id="age" min="12" max="25" required placeholder="12–25">
            </label>
            <label>Gender
              <select id="gender" required></select>
            </label>
            <label>Country
              <select id="country" required></select>
            </label>
            <label>Academic level
              <select id="academic" required></select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Social media use</legend>
          <div class="grid">
            <label>Most used platform
              <select id="most_used_platform" required></select>
            </label>
            <label>Main purpose
              <select id="purpose_of_use" required></select>
            </label>
            <label>Daily usage (hours)
              <input type="number" id="avg_daily_usage_hours" min="0" max="24" step="0.1" required>
            </label>
            <label>Phone unlocks per day
              <input type="number" id="daily_unlocks" min="0" step="1" required>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Daily routine</legend>
          <div class="grid">
            <label>Study (hours)
              <input type="number" id="study_hours" min="0" max="24" step="0.1" required>
            </label>
            <label>Physical activity (hours)
              <input type="number" id="physical_activity_hours" min="0" max="24" step="0.1" required>
            </label>
            <label>Sleep per night (hours)
              <input type="number" id="sleep_hours_per_night" min="0" max="24" step="0.1" required>
            </label>
            <label>Stress level
              <select id="stress" required></select>
            </label>
          </div>
        </fieldset>

        <button type="submit" id="submit-btn">Predict score</button>
      </form>
    </section>

    <aside class="result-side" aria-live="polite">
      <div class="panel">
        <svg class="gauge" viewBox="0 0 200 120" role="img" aria-label="Score gauge">
          <path class="track" d="M20 100 A80 80 0 0 1 180 100" pathLength="100"/>
          <path class="fill" id="gauge-fill" d="M20 100 A80 80 0 0 1 180 100" pathLength="100"/>
        </svg>
        <div class="score" id="score">–</div>
        <p class="verdict" id="verdict">Your result will appear here.</p>
        <p class="error" id="error" hidden></p>
      </div>
    </aside>
  </main>
  <script src="script.js"></script>
</body>
</html>
